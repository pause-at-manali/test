<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube link</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; margin-right: 8px; }
    #output { margin-top: 20px; padding: 16px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; min-height: 60px; }
    .status { font-size: 14px; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Youtube link</h1>
  <p>Click Here.</p>

  <button id="start">Start Youtube link</button>
 

  <div id="output">No data yet.</div>
  <div class="status" id="status"></div>

  <script>
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    let watchId = null;
    let count = 0;

    startBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        output.textContent = 'Geolocation not supported by this browser.';
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          count++;
          output.textContent =
            `Latitude:  ${latitude}\n` +
            `Longitude: ${longitude}\n` +
            `Accuracy:  ±${accuracy} m\n` +
            `Updated:   ${new Date(position.timestamp).toLocaleTimeString()}`;
          status.textContent = `Live — ${count} update(s) received.`;
          console.log(latitude, longitude);
          // To send to a backend, POST { latitude, longitude } here.
        },
        (error) => {
          output.textContent = 'Error: ' + error.message;
          status.textContent = 'Stopped due to error.';
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );

      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent = 'Starting…';
    });

    stopBtn.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = `Stopped after ${count} update(s).`;
    });
  </script>
</body>
</html>
